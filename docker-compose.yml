# Runs the whole cloud side on one machine:  docker compose up --build
# Owner page: http://localhost:8000   MQTT (TLS): port 8883
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shelf}
      POSTGRES_DB: shelf
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "8883:8883"
    volumes:
      - ./broker/config:/mosquitto/config:ro
      - ./broker/certs:/mosquitto/certs:ro
      - mqttdata:/mosquitto/data
    restart: unless-stopped

  api:
    build: ./cloud
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://shelf:${POSTGRES_PASSWORD:-shelf}@db:5432/shelf
      MQTT_HOST: mosquitto
      MQTT_CA_FILE: /certs/ca.crt
    volumes:
      - ./broker/certs/ca.crt:/certs/ca.crt:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  mqttdata:
