<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shelf-Stock Monitor</title>
  {% block head %}{% endblock %}
  <style>
    :root { --ink:#1d2433; --muted:#6b7280; --line:#e5e7eb; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --accent:#1f4e79; }
    * { box-sizing: border-box; }
    body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); margin: 0; background: #f7f8fa; }
    header { background: var(--accent); color: #fff; padding: 14px 24px; }
    header h1 { font-size: 18px; margin: 0; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 24px 60px; }
    h2 { font-size: 16px; margin: 28px 0 10px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: #fafafa; }
    .count { font-size: 22px; font-weight: 700; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .ok { background: #dcfce7; color: var(--ok); } .unverified { background: #fef3c7; color: var(--warn); } .offline, .error { background: #fee2e2; color: var(--bad); }
    .muted { color: var(--muted); font-size: 13px; }
    form.inline { display: inline; }
    button, .btn { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid #c7ccd4; background: #fff; border-radius: 6px; cursor: pointer; color: var(--ink); text-decoration: none; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    input[type=number] { width: 56px; font: inherit; padding: 3px 4px; }
    select { font: inherit; padding: 6px; min-width: 360px; }
    .msg { background: #e0ecf8; border: 1px solid #b6cde6; padding: 8px 12px; border-radius: 6px; margin-bottom: 14px; }
    .err { background: #fee2e2; border-color: #fecaca; }
    .banner { background: #fef3c7; border: 1px solid #fde68a; padding: 8px 12px; border-radius: 6px; margin-bottom: 14px; }
  </style>
</head>
<body>
  <header><h1>Shelf-Stock Monitor · owner page</h1></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
